# Typical output size per tool, in characters, with a budget so growth is noticed.
- id: size-list-projects
  title: list_projects stays short (typical output under 1300 characters)
  input:
    op: output_size
    tool: list_projects
    args: {}
  checks:
  - {type: at_most, path: chars, value: 1300}
- id: size-get-style-brief
  title: get_style_brief stays short (typical output under 2400 characters)
  input:
    op: output_size
    tool: get_style_brief
    args: {project_id: synthetic-sandbox}
  checks:
  - {type: at_most, path: chars, value: 2400}
