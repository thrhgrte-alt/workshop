- id: size-tool-descriptions
  title: Tool descriptions are concise (each at most 300 characters; all together under a budget) and rare tools are marked
  input: {op: descriptions}
  checks:
  - {type: at_most, path: longest, value: 300}
  - {type: at_most, path: total, value: 6500}
  - type: list_contains
    path: rare
    items: [apply_safe_fix, save_report, compare_versions, suggest_profile_promotions, record_override, promote_run, search_library]
  - {type: at_least, path: tools, value: 21}
