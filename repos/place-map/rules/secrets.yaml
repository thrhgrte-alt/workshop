# What counts as a secret (never stored, never emitted). Applied by the generated Luau AND again at ingest; heuristics, not a guarantee - review samples before sharing a snapshot.
version: 1
key_name_tokens: [token, secret, apikey, api_key, password, passwd, passphrase, credential, auth, bearer, webhook, privatekey, private_key, signature, cookie]
key_name_exact: [key, keys, pat]
value_patterns:
  - '(?i)\b(sk|pk|rk)[-_][A-Za-z0-9]{16,}'
  - '\bgh[pousr]_[A-Za-z0-9]{20,}'
  - '\bAKIA[0-9A-Z]{16}\b'
  - '\beyJ[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{4,}'
  - '(?i)https?://[^\s"'']*(webhook|hooks\.slack|discord(app)?\.com/api)[^\s"'']*'
  - '(?i)[?&](token|key|secret|sig|signature)=[^\s&"'']{8,}'
  - '(?i)\bbearer\s+[A-Za-z0-9._~+/=-]{16,}'
long_opaque_min_chars: 32      # a single word of letters/digits/+/=_- at least this long, with both a digit and a letter, is treated as a key
