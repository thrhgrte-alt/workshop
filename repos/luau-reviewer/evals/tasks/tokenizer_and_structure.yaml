# The tokenizer and block matcher must keep comments and strings out of the rules, and must not choke on odd input.
- id: tok-line-comment-is-masked
  title: A line comment is blanked out; the code on the next line is kept
  input: {op: tokens, code: "local x = 1 -- wait(1)\nwait(2)"}
  checks:
    - {type: contains, path: masked, text: "wait(2)"}
    - {type: excludes, path: masked, text: "wait(1)"}
    - {type: equals, path: kinds, value: [keyword, name, op, number, comment, name, op, number, op]}
- id: tok-block-comment-spans-lines-and-keeps-line-numbers
  title: A multi-line block comment is one token; the next token is on line 3
  input: {op: tokens, code: "--[[ a\nwait()\n]] local y"}
  checks:
    - {type: equals, path: kinds, value: [comment, keyword, name]}
    - {type: equals, path: lines, value: [1, 3, 3]}
    - {type: excludes, path: masked, text: "wait"}
- id: tok-leveled-long-comment-ignores-short-closers
  title: "--[==[ ... ]] ... ]==] closes only at the matching level"
  input: {op: tokens, code: "--[==[ ]] still a comment ]==] x"}
  checks:
    - {type: equals, path: kinds, value: [comment, name]}
- id: tok-long-string-with-brackets-inside
  title: A leveled long string may contain ]] and keywords
  input: {op: tokens, code: "local s = [==[ a ]] while true do ]==] print(s)"}
  checks:
    - {type: equals, path: kinds, value: [keyword, name, op, string, name, op, name, op]}
    - {type: excludes, path: masked, text: "while"}
- id: tok-quoted-string-with-escaped-quote
  title: An escaped quote does not end the string
  input: {op: tokens, code: "x = \"say \\\"wait()\\\" now\" y"}
  checks:
    - {type: equals, path: kinds, value: [name, op, string, name]}
- id: tok-unterminated-string-recovers-on-next-line
  title: A broken string ends at the line end so later code is still seen
  input: {op: tokens, code: "x = \"oops\nwait(1)"}
  checks:
    - {type: list_contains, path: texts, items: [wait]}
    - {type: equals, path: lines, value: [1, 1, 1, 2, 2, 2, 2]}
- id: tok-interpolated-string-is-one-token
  title: A backtick string with {expressions} and quotes is a single string token
  input: {op: tokens, code: "x = `a {b} \"q\" wait()` y"}
  checks:
    - {type: equals, path: kinds, value: [name, op, string, name]}
- id: tok-numbers-and-concat-operator
  title: "1..2 is number, .., number; hex and exponent numbers are single tokens"
  input: {op: tokens, code: "a = 1..2 + 0xFF + 1e3"}
  checks:
    - {type: equals, path: texts, value: [a, "=", "1", "..", "2", "+", "0xFF", "+", "1e3"]}
- id: tok-compound-assignment-operators
  title: Luau compound operators are single tokens
  input: {op: tokens, code: "x += 1 ..= y //= 2"}
  checks:
    - {type: equals, path: texts, value: [x, "+=", "1", "..=", y, "//=", "2"]}
- id: struct-if-expression-opens-no-block
  title: "`local x = if a then b else c` has no `end`, so it must not open a block"
  input: {op: structure, code: "local x = if a then b else c\nlocal function f() end"}
  checks:
    - {type: equals, path: blocks, value: [function]}
    - {type: equals, path: balanced, value: true}
- id: struct-statement-if-opens-one-block
  title: An if/elseif/else statement is one block
  input: {op: structure, code: "if a then b() elseif c then d() else e() end"}
  checks:
    - {type: equals, path: blocks, value: [if]}
    - {type: equals, path: balanced, value: true}
- id: struct-nested-loops-and-repeat
  title: for, while and repeat/until nest correctly
  input: {op: structure, code: "for i = 1, 3 do while x do repeat y() until z end end"}
  checks:
    - {type: equals, path: blocks, value: [for, while, repeat]}
    - {type: equals, path: balanced, value: true}
- id: struct-else-if-expression-chain
  title: "`else if` inside an if-expression stays an expression"
  input: {op: structure, code: "local v = if a then 1 else if b then 2 else 3\nprint(v)"}
  checks:
    - {type: equals, path: blocks, value: []}
    - {type: equals, path: balanced, value: true}
- id: struct-function-params-and-calls
  title: Function parameters and call names are recovered
  input: {op: structure, code: "function M.add(a: number, b) return a + b end\nM.add(1, 2)"}
  checks:
    - {type: equals, path: params, value: {M.add: [a, b]}}
    - {type: equals, path: calls, value: [M.add]}
- id: struct-unbalanced-input-does-not-crash
  title: Truncated code is reported as unbalanced, not as an exception
  input: {op: structure, code: "function f()\n  if x then"}
  checks:
    - {type: equals, path: balanced, value: false}
