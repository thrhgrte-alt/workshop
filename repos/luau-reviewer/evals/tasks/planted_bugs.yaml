# One planted bug per file: the review must report the expected rule id (and nothing else). Generated by scripts/make_examples.py from scripts/example_fixtures.py.
- id: neg-sec001-unvalidated-remote-server
  title: 'The EquipItem handler uses `itemName` and `slot` straight from the client: no typeof, no range check, no allow-list.'
  expect_rules:
  - SEC001
  expect_questions: []
  input:
    op: review
    file: examples/negative/sec001_unvalidated_remote.server.luau
    strict: false
  checks:
  - type: has_rule
    rule: SEC001
  - type: precision_recall
