# Output-size budgets (token discipline): the typical answer of every tool, in characters of compact JSON. They are guard rails, not hand-computed values: if a change makes an answer bigger,
# this fails and the change has to justify it. ~4 characters is roughly one token.
- id: budget-measure-image
  tags: [budget, token-discipline]
  input:
    op: tools_seq
    images:
      a: {gen: vstep, size: [100, 100], left: [0, 0, 0], right: [255, 255, 255], x: 50}
      b: {gen: rect, size: [100, 100], bg: [200, 200, 200], fg: [30, 30, 30], box: [20, 20, 60, 60]}
      t: {gen: smooth_tile, size: [128, 128], seed: 7}
      r: {gen: gray_noise, size: [100, 100], seed: 3, mean: 0.5, amp: 0.2}
      n: {gen: normal_noisy, size: [100, 100], seed: 5, tilt: 0.3}
    steps:
      - {tool: measure_image, args: {path: "@a", project_id: demo-stylized-obby, place_id: stage-1}}
  checks:
    - {type: step_ok, step: 0}
    - {type: budget, step: 0, chars: 2100}

