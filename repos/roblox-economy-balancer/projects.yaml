# SYNTHETIC registry of projects and places (generated by scripts/make_examples.py). Replace with your own games, or point ECONBAL_PROJECTS at your private file.
# Each place has ONE economy spec, ONE set of target pacing bands and ONE decision history (workspace/projects/<project_id>/<place_id>/).
projects:
  - project_id: demo_mine
    alias: Demo Mine (SYNTHETIC)
    universe_id: 0
    synthetic: true
    places:
      - {place_id: main, alias: Main mine, studio_name: "Demo Mine Main (SYNTHETIC)", roblox_place_id: 0, spec: projects/demo_mine/main/economy.yaml}
      - {place_id: hardcore, alias: Hardcore mode, studio_name: "Demo Mine Hardcore (SYNTHETIC)", roblox_place_id: 0, spec: projects/demo_mine/hardcore/economy.yaml, bands: projects/demo_mine/hardcore/bands.yaml}
  - project_id: demo_tycoon
    alias: Demo Tycoon (SYNTHETIC)
    universe_id: 9000000000
    synthetic: true
    places:
      - {place_id: main, alias: Tycoon, studio_name: "Demo Tycoon (SYNTHETIC)", roblox_place_id: 9000000001, spec: projects/demo_tycoon/main/economy.yaml}
