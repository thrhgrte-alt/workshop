# Accepted shapes of the raw execute_luau answer (all schema_unverified: written from the documented assumption, not from a real capture). Same boot result, same console, same verdict.
- id: shape-result-mapping
  tags: [parser, hub-shape, schema_unverified]
  input:
    op: judge_docs
    check: boot
    console: "10:00:00.000 Server started"
    results:
      - {"schema": "playqa.result/1", "check_id": "boot", "kind": "boot", "repeat_no": 1, "assertions": [], "measures": {"missing_services": [], "missing_paths": []}}
  checks:
    - {type: equals, path: verdict, value: pass}

