# SYNTHETIC. This place declares a data section WITHOUT a test-mode switch on purpose: generating its data check must be refused.
version: 1
synthetic: true
boot:
  expected_services: [Workspace, ReplicatedStorage]
  expected_paths: [Workspace.Plots]
remotes:
  items:
    - {id: ClaimPlot, path: ReplicatedStorage.Remotes.ClaimPlot, class: RemoteFunction, valid_args: [[1]]}
economy:
