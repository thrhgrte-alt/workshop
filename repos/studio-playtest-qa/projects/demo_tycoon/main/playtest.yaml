    cash: {path: leaderstats.Cash, currency: true}
  steps:
    - {id: collect, action: {kind: bindable, path: ServerScriptService.QA.Collect}, expect: {cash: {range: gain}}}
data:
  save_hook: ServerScriptService.QA.SaveData
  load_hook: ServerScriptService.QA.LoadData
  values:
    cash: {path: leaderstats.Cash, marker: 500}
