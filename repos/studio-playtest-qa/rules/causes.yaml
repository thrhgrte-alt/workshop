# Most-likely-cause rules for failure reports. The first rule whose conditions all hold wins; the reply says WHICH rule matched ("rule:<id>") and that a cause is a
# heuristic reading of the evidence, never a verified diagnosis. A rule matches on the check kind, an assertion id (exact) and optional conditions:
#   log: a regex searched in the evidence log lines;  status: a pathfinding status among the failed edges;  ratio: bounds on measured/expected;
#   detail: a regex searched in the assertion's detail text.
version: 1
rules:
  - {id: boot-nil-index, kind: boot, assertion: [console_no_errors, log_service_clean], log: "attempt to index nil", cause: "a boot script indexed a nil value: usually a child that does not exist yet (a missing WaitForChild) or a renamed instance", next: "open the script and line named in the log line"}
  - {id: boot-not-valid-member, kind: boot, assertion: [console_no_errors, log_service_clean], log: "is not a valid member of", cause: "a boot script reads a child or property that is missing: a rename, a deleted instance or a wrong path", next: "compare the named member with the Explorer"}
  - {id: boot-error-generic, kind: boot, assertion: [console_no_errors, log_service_clean], cause: "a script raised an error while the place was starting", next: "fix the first error line; later lines are often follow-on failures"}
  - {id: boot-warning, kind: boot, assertion: console_no_warnings, log: "Infinite yield possible", cause: "a WaitForChild or :WaitForChild-like call waits for something that never appears", next: "check the instance path in the warning"}
  - {id: boot-warning-generic, kind: boot, assertion: console_no_warnings, cause: "a script printed a warning during start-up", next: "decide whether it is expected; if so add it to log_ignore in playtest.yaml"}
  - {id: boot-missing-path, kind: boot, assertion: paths_exist, cause: "an expected folder or instance is missing: renamed, never created, or created later than the check ran", next: "compare the listed path with the Explorer, or fix expected_paths in playtest.yaml"}
  - {id: boot-missing-service, kind: boot, assertion: services_exist, cause: "an expected service is not present in this session", next: "check the spelling of the service name in playtest.yaml"}
  - {id: spawn-no-character, kind: spawn, assertion: character_spawned, cause: "no character appeared: no SpawnLocation, a respawn script that errors, or CharacterAutoLoads turned off", next: "check the spawn location and any script that calls LoadCharacter"}
  - {id: spawn-stuck, kind: spawn, assertion: not_stuck, cause: "the character is wedged: the spawn point overlaps geometry, or a wall or anchored part is in front of it", next: "move the spawn or inspect parts near the spawn position in the evidence"}
  - {id: spawn-void, kind: spawn, assertion: above_void, cause: "the character fell out of the world: no floor under the spawn", next: "check the floor under the spawn position"}
  - {id: spawn-bad-surface, kind: spawn, assertion: floor_valid, cause: "the character spawned on a surface on the invalid list (for example lava or a kill brick)", next: "move the spawn off that surface"}
  - {id: spawn-no-floor, kind: spawn, assertion: floor_found, cause: "nothing was found under the character within the ray length", next: "check the floor, or raise spawn_floor_ray_studs if the spawn is high"}
  - {id: reach-fail-start, kind: reachability, assertion: area_reachable, status: "FailStartNotEmpty", cause: "the pathfinder's start point is inside a part (the spawn overlaps geometry)", next: "move the spawn point or check what overlaps it"}
  - {id: reach-fail-finish, kind: reachability, assertion: area_reachable, status: "FailFinishNotEmpty", cause: "the area's target point is inside a part", next: "move the area's target point out of the geometry"}
  - {id: reach-no-path, kind: reachability, assertion: area_reachable, status: "NoPath", cause: "no walkable route: a closed door, a wall, a gap wider than a jump, or an opening narrower than the agent radius", next: "check the opening towards the area, CanCollide on door parts, and the agent radius in playtest.yaml"}
  - {id: reach-out-of-range, kind: reachability, assertion: area_reachable, status: "ClosestOutOfRange", cause: "the target is too far from walkable ground for the pathfinder", next: "move the target point onto walkable ground"}
  - {id: reach-unresolved, kind: reachability, assertion: areas_resolved, cause: "an area path in playtest.yaml does not exist in the open place: renamed or removed", next: "fix the path or the instance name"}
  - {id: reach-end-gap, kind: reachability, assertion: path_ends_at_target, cause: "the path succeeds but stops short of the target: the final stretch is blocked or the target is off the navigable surface", next: "move the target point or open the last stretch"}
  - {id: reach-generic, kind: reachability, assertion: area_reachable, cause: "the pathfinder found no usable route from the spawn to this area", next: "inspect the statuses in the evidence"}
  - {id: remote-handler-threw, kind: remotes, assertion: valid_call_no_error, cause: "the server handler raised an error on a valid call: a nil read or a missing argument check inside the handler", next: "open the handler script named in the log line"}
  - {id: remote-bad-input-threw, kind: remotes, assertion: bad_input_no_error, cause: "the handler raised an error on malformed input instead of rejecting it: missing type or range validation at the top of the handler", next: "validate the argument types and ranges first and return false"}
  - {id: remote-accepted-bad, kind: remotes, assertion: bad_input_rejected, cause: "the handler accepted a malformed payload: no validation of that argument", next: "validate the argument named by the probe label and return false when it is wrong"}
  - {id: remote-no-response, kind: remotes, assertion: valid_call_responds, cause: "the RemoteFunction handler did not return in time: it yields forever, or OnServerInvoke is not set", next: "check that OnServerInvoke is assigned on the server and returns"}
  - {id: remote-missing, kind: remotes, assertion: remote_found, cause: "the remote is missing or has another class: renamed, not created yet, or created after the check ran", next: "compare the path and class with playtest.yaml"}
  - {id: econ-unexpected-change, kind: economy, assertion: delta_as_expected, expected_zero: true, cause: "the value changed although the step should not have changed it: a purchase that should have been refused went through, or a side effect", next: "check the guard at the top of the handler (balance, ownership, input)"}
  - {id: econ-wrong-direction, kind: economy, assertion: delta_as_expected, ratio: {max: -0.0001}, cause: "the value moved the opposite way: a sign error (a purchase that pays, or a sale that charges)", next: "check the sign in the handler"}
  - {id: econ-not-applied, kind: economy, assertion: delta_as_expected, ratio: {min: -0.0001, max: 0.0001}, cause: "the action changed nothing: the handler did not run, or it applied the change to a different value or player", next: "check the action path and which leaderstat the handler writes"}
  - {id: econ-doubled, kind: economy, assertion: delta_as_expected, ratio: {min: 1.9, max: 2.1}, cause: "the change was applied about twice: a double-fire, a duplicated connection or a multiplier applied twice", next: "look for two handlers or a doubled multiplier on this step"}
  - {id: econ-too-big, kind: economy, assertion: delta_as_expected, ratio: {min: 1.01}, cause: "the change is larger than expected: a wrong multiplier or an unexpected bonus", next: "compare the handler's formula with the configured expectation"}
  - {id: econ-too-small, kind: economy, assertion: delta_as_expected, ratio: {min: 0.0001, max: 0.99}, cause: "the change is smaller than expected: a fee, a rounding step or a partial application", next: "compare the handler's formula with the configured expectation"}
  - {id: econ-negative, kind: economy, assertion: balance_not_negative, cause: "a balance went below zero: a purchase does not check the balance first", next: "add a balance check before deducting"}
  - {id: econ-runaway, kind: economy, assertion: delta_within_cap, cause: "one step moved a value by far more than the cap: an unbounded multiplier or a loop", next: "check the formula for the step"}
  - {id: econ-step-error, kind: economy, assertion: step_ran, cause: "the step's action raised an error: wrong path, wrong class or an argument the handler rejects", next: "read the error text in the evidence"}
  - {id: data-no-switch, kind: data, assertion: test_mode_on, cause: "the test-mode switch is missing or off, so the script refused to touch data", next: "turn the switch on in the Studio session (never in the published place)"}
  - {id: data-no-ack, kind: data, assertion: test_mode_acknowledged, cause: "the game's data layer did not confirm test mode: it may still point at the live store", next: "stop; make the data layer honour the switch before running this check"}
  - {id: data-mismatch, kind: data, assertion: values_roundtrip, cause: "a value did not come back as saved: it is missing from the save payload, or the load hook runs before the save finished", next: "compare the saved keys with the watched value ids"}
  - {id: data-hook-error, kind: data, assertion: hooks_ran, cause: "a save or load hook raised an error", next: "read the error text in the evidence"}
  - {id: perf-parts, kind: perf, assertion: within_baseline, detail: "part_count", cause: "more parts than the baseline: new content or something that spawns parts and never removes them", next: "compare part counts per folder between the baseline and now"}
  - {id: perf-memory, kind: perf, assertion: within_baseline, detail: "memory_mb", cause: "memory is above the baseline: new assets, or a leak that grows with time", next: "check growth_over_run: if memory also grew during the run, suspect a leak"}
  - {id: perf-frame, kind: perf, assertion: within_baseline, detail: "frame_ms", cause: "frames take longer than at the baseline: heavier scripts or more active parts", next: "check script_count and recently added loops"}
  - {id: perf-scripts, kind: perf, assertion: within_baseline, detail: "script_count", cause: "more scripts than the baseline", next: "list scripts added since the baseline"}
  - {id: perf-growth, kind: perf, assertion: growth_over_run, cause: "memory grew during the run: a leak is possible (instances or connections never released)", next: "repeat with a longer run and watch whether growth continues"}
  - {id: generic, kind: "*", assertion: "*", cause: "no specific rule matched this evidence", next: "read the evidence lines and the measured values"}
