name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[dev]"
      - run: python -m pytest
      - run: python -m conceptai check-skills
      - run: python -m conceptai sync-agent-files --check
      - run: python scripts/build_schema.py --check
      - run: python -m conceptai eval run --label ci
